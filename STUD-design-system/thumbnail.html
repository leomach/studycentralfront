<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:0 0 75%;background:var(--coral);display:grid;place-items:center}
.mark{font-family:var(--font-poster);font-size:236px;line-height:0.8;letter-spacing:-0.05em;color:var(--ink);text-transform:uppercase}
.strip{flex:1;display:flex;flex-direction:column}.strip div{flex:1}</style>
</head><body>
<div class="main"><span class="mark">Stud</span></div>
<div class="strip"><div style="background:var(--spring)"></div><div style="background:var(--sun)"></div><div style="background:var(--lilac)"></div><div style="background:var(--forest)"></div></div>
</body></html>
