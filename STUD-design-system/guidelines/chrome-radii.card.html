<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--cream);padding:16px;font-family:var(--font-sans);color:var(--text-strong)}
a{color:var(--accent)}a:hover{color:var(--accent-press)}
.sw{border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:92px}
.sw b{font-family:var(--font-sans);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;display:block}
.sw code{font-family:var(--font-mono);font-size:10px;opacity:0.7}
.grid{display:grid;gap:10px}
.lbl{font-family:var(--font-mono);font-size:11px;opacity:0.55}</style>
</head><body><div style="display:flex;gap:12px">
<div style="flex:1;height:100px;background:var(--white);border-radius:var(--radius-xs);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">xs</div><div style="flex:1;height:100px;background:var(--white);border-radius:var(--radius-sm);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">sm</div><div style="flex:1;height:100px;background:var(--white);border-radius:var(--radius-md);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">md</div><div style="flex:1;height:100px;background:var(--white);border-radius:var(--radius-lg);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">lg</div><div style="flex:1;height:100px;background:var(--white);border-radius:var(--radius-xl);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">xl</div><div style="flex:1;height:100px;background:var(--white);border-radius:var(--radius-pill);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">pill</div></div></body></html>
