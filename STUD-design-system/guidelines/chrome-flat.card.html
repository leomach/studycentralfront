<!-- @dsCard group="Chrome" viewport="700x200" name="Flat by default" subtitle="Colour blocks carry hierarchy; outline and shadow are accents" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--cream);padding:16px;font-family:var(--font-sans);color:var(--text-strong)}
a{color:var(--accent)}a:hover{color:var(--accent-press)}
.sw{border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:92px}
.sw b{font-family:var(--font-sans);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;display:block}
.sw code{font-family:var(--font-mono);font-size:10px;opacity:0.7}
.grid{display:grid;gap:10px}
.lbl{font-family:var(--font-mono);font-size:11px;opacity:0.55}</style>
</head><body><div style="display:flex;gap:14px">
<div style="flex:1;height:120px;border-radius:var(--radius-lg);background:var(--spring);display:grid;place-items:center;font-weight:900;font-size:13px">flat (default)</div>
<div style="flex:1;height:120px;border-radius:var(--radius-lg);background:var(--white);border:var(--stroke-2) solid var(--rule);display:grid;place-items:center;font-weight:900;font-size:13px">outlined</div>
<div style="flex:1;height:120px;border-radius:var(--radius-lg);background:var(--white);border:var(--stroke-2) solid var(--rule);box-shadow:var(--shadow-hard);display:grid;place-items:center;font-weight:900;font-size:13px">sticker</div>
<div style="flex:1;height:120px;border-radius:var(--radius-panel) var(--radius-panel) 0 0;background:var(--white);box-shadow:var(--shadow-panel);display:grid;place-items:center;font-weight:900;font-size:13px;align-self:flex-end;height:96px">panel</div></div></body></html>
