<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--sun);padding:14px;font-family:var(--font-sans);color:var(--text-strong)}
a{color:var(--accent)}a:hover{color:var(--accent-press)}
.sw{border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:92px}
.sw b{font-family:var(--font-sans);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;display:block}
.sw code{font-family:var(--font-mono);font-size:10px;opacity:0.7}
.grid{display:grid;gap:10px}
.lbl{font-family:var(--font-mono);font-size:11px;opacity:0.55}</style>
</head><body><div style="display:flex;gap:22px;align-items:center;justify-content:space-between">
<div style="display:flex;gap:8px;align-items:flex-end">
  <div style="width:20px;height:22px;background:var(--ink);border-radius:10px"></div><div style="width:20px;height:22px;background:var(--ink);border-radius:10px"></div>
</div>
<div style="font-family:var(--font-poster);font-size:64px;letter-spacing:-0.05em;text-transform:uppercase;line-height:0.8">Stud</div>
<div style="width:88px;height:48px;background:var(--ink);border-radius:0 0 60px 60px"></div></div>
<div class="lbl" style="margin-top:10px">Eyes + mouth built from rounded blocks. Never emoji, never a drawn logo.</div></body></html>
