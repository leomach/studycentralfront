<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px grid, 1–20" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--cream);padding:16px;font-family:var(--font-sans);color:var(--text-strong)}
a{color:var(--accent)}a:hover{color:var(--accent-press)}
.sw{border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:92px}
.sw b{font-family:var(--font-sans);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;display:block}
.sw code{font-family:var(--font-mono);font-size:10px;opacity:0.7}
.grid{display:grid;gap:10px}
.lbl{font-family:var(--font-mono);font-size:11px;opacity:0.55}</style>
</head><body><div style="display:flex;align-items:flex-end;gap:8px">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-1);height:var(--space-1);background:var(--ink);border-radius:3px"></div><span class="lbl">1</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-2);height:var(--space-2);background:var(--ink);border-radius:3px"></div><span class="lbl">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-3);height:var(--space-3);background:var(--ink);border-radius:3px"></div><span class="lbl">3</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-4);height:var(--space-4);background:var(--ink);border-radius:3px"></div><span class="lbl">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-5);height:var(--space-5);background:var(--ink);border-radius:3px"></div><span class="lbl">5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-6);height:var(--space-6);background:var(--ink);border-radius:3px"></div><span class="lbl">6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-8);height:var(--space-8);background:var(--ink);border-radius:3px"></div><span class="lbl">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-10);height:var(--space-10);background:var(--ink);border-radius:3px"></div><span class="lbl">10</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-12);height:var(--space-12);background:var(--ink);border-radius:3px"></div><span class="lbl">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-16);height:var(--space-16);background:var(--ink);border-radius:3px"></div><span class="lbl">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-20);height:var(--space-20);background:var(--ink);border-radius:3px"></div><span class="lbl">20</span></div></div></body></html>
