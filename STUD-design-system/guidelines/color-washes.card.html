<!-- @dsCard group="Colors" viewport="700x150" name="State washes" subtitle="Quiet fills behind body text" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--cream);padding:16px;font-family:var(--font-sans);color:var(--text-strong)}
a{color:var(--accent)}a:hover{color:var(--accent-press)}
.sw{border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:92px}
.sw b{font-family:var(--font-sans);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;display:block}
.sw code{font-family:var(--font-mono);font-size:10px;opacity:0.7}
.grid{display:grid;gap:10px}
.lbl{font-family:var(--font-mono);font-size:11px;opacity:0.55}</style>
</head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw" style="background:var(--correct-wash);color:var(--ink)"><b>correct-wash</b><code>#DDFBE9</code></div><div class="sw" style="background:var(--wrong-wash);color:var(--ink)"><b>wrong-wash</b><code>#FCE3DF</code></div><div class="sw" style="background:var(--due-wash);color:var(--ink)"><b>due-wash</b><code>#FDF4CF</code></div><div class="sw" style="background:var(--accent-wash);color:var(--ink)"><b>accent-wash</b><code>#FDE3DA</code></div><div class="sw" style="background:var(--lilac-wash);color:var(--ink)"><b>lilac-wash</b><code>#EFE8FF</code></div></div></body></html>
