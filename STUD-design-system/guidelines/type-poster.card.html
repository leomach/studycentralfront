<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--coral);padding:14px;font-family:var(--font-sans);color:var(--text-strong)}
