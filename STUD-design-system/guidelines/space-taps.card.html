<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--white);padding:16px;font-family:var(--font-sans);color:var(--text-strong)}
a{color:var(--accent)}a:hover{color:var(--accent-press)}
.sw{border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:92px}
.sw b{font-family:var(--font-sans);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;display:block}
.sw code{font-family:var(--font-mono);font-size:10px;opacity:0.7}
.grid{display:grid;gap:10px}
.lbl{font-family:var(--font-mono);font-size:11px;opacity:0.55}</style>
</head><body><div style="display:flex;gap:12px;align-items:flex-end">
<div style="flex:1;min-height:var(--tap-min);background:var(--ink);color:var(--cream);border-radius:var(--radius-pill);display:grid;place-items:center;font-weight:900;font-size:14px">44 px</div><div style="flex:1;min-height:var(--tap-lg);background:var(--ink);color:var(--cream);border-radius:var(--radius-pill);display:grid;place-items:center;font-weight:900;font-size:14px">56 px</div><div style="flex:1;min-height:var(--tap-xl);background:var(--ink);color:var(--cream);border-radius:var(--radius-pill);display:grid;place-items:center;font-weight:900;font-size:14px">68 px</div></div></body></html>
