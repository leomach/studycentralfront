<!-- @dsCard group="Colors" viewport="700x160" name="Dark shell" subtitle="[data-theme=dark] flips paper and ink; canvases hold" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:#17171a;padding:16px;font-family:var(--font-sans);color:var(--text-strong)}
a{color:var(--accent)}a:hover{color:var(--accent-press)}
.sw{border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;min-height:92px}
.sw b{font-family:var(--font-sans);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:0.1em;display:block}
.sw code{font-family:var(--font-mono);font-size:10px;opacity:0.7}
.grid{display:grid;gap:10px}
.lbl{font-family:var(--font-mono);font-size:11px;opacity:0.55}</style>
</head><body><div data-theme="dark" class="stud-dark"><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw" style="background:#17171a;color:#F7F5EE"><b>paper</b><code>#17171A</code></div><div class="sw" style="background:#212126;color:#F7F5EE"><b>surface</b><code>#212126</code></div><div class="sw" style="background:#f7f5ee;color:var(--ink)"><b>text-strong</b><code>#F7F5EE</code></div><div class="sw" style="background:var(--coral);color:var(--white)"><b>coral</b><code>unchanged</code></div><div class="sw" style="background:var(--spring);color:var(--ink)"><b>spring</b><code>unchanged</code></div></div></div></body></html>
